{% extends 'base.html' %}

{% block title %}
Add Movie
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <h2 class="mb-4">Add New Movie</h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                Add Movie
            </button>

        </form>

    </div>

</div>

{% endblock %}
