{% extends 'base.html' %}

{% block content %}

<h2>Delete Movie</h2>

<p>

Are you sure you want to delete

<strong>{{ movie.title }}</strong>?

</p>

<form method="POST">

    {% csrf_token %}

    <button class="btn btn-danger">

        Yes, Delete

    </button>

    <a href="{% url 'movie_detail' movie.id %}"
       class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
